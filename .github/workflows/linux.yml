name: Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      # Both compilers run to the end: a picture that differs with one of them only shows up as such.
      fail-fast: false
      matrix:
        compiler: [ { cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ } ]
    steps:
      # The whole history: DocsCheck compares CHANGELOG.md with it (Tests/changelog.py).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb mesa-utils \
            libgl1-mesa-dri libglx-mesa0

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The quick tests; the ones labelled "gui" (they run the editor / the exported game) have steps of their own.
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE gui

      # Every unit test's result and time (JSON and JUnit XML, written by ZaminTests --report / --junit under ctest).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-${{ matrix.compiler.cc }}
          path: build/TestResults/
          if-no-files-found: warn

      # Mesa's software rasteriser (llvmpipe) in a fixed 1280x720x24 xvfb screen, as locally: Tests/render_tests.sh.
      # Every case's picture, difference and reference | new | difference strip, report.json and summary.md (also
      # on the run's page) go to the artefact - for a failed case they show what changed.
      - name: Rendering regression test (reference pictures)
        run: Tests/render_tests.sh --save-all --out render-test-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-tests-${{ matrix.compiler.cc }}
          path: render-test-output/
          if-no-files-found: warn

      # Pixel oracles for terrain layers/cache and shadow atlas resize at the minimum GL version.
      - name: Terrain and GPU profiler tests (OpenGL 4.1)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
          MESA_GL_VERSION_OVERRIDE: "4.1"
          MESA_GLSL_VERSION_OVERRIDE: "410"
          ZAMIN_GL_DEBUG: "1"
        run: |
          xvfb-run -a ./build/bin/ZaminTerrainSurfaceTests
          xvfb-run -a ./build/bin/ZaminResidencyGPUTests
          xvfb-run -a ./build/bin/ZaminGPUProfilerTests
          xvfb-run -a ./build/bin/ZaminFoliageRenderTests

      - name: Packed foliage compute oracle (OpenGL 4.3)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
          MESA_GL_VERSION_OVERRIDE: "4.3"
          MESA_GLSL_VERSION_OVERRIDE: "430"
          ZAMIN_GL_DEBUG: "1"
        run: xvfb-run -a ./build/bin/ZaminFoliageRenderTests --require-gpu

      - name: World streaming camera tours and editor panel
        run: python3 Tests/world_streaming_test.py --build build --out world-streaming

      - name: Sparse world navigation and traversal workflow
        run: python3 Tests/world_navigation_test.py --build build --out world-streaming/navigation

      - name: World checkpoint and authoring workflow
        run: python3 Tests/world_checkpoint_test.py --build build --out world-streaming/checkpoint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-streaming-${{ matrix.compiler.cc }}
          path: world-streaming/
          if-no-files-found: warn

      # Every window, page, menu and popup of the editor for a few frames (Showcase3D, Platformer2D): an error in
      # the log, an OpenGL error (debug context) or a failed ImGui check fails it. Logs and some steps' pictures.
      - name: Editor smoke test (every panel)
        run: Tests/editor_smoke.sh --shots --out editor-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-smoke-${{ matrix.compiler.cc }}
          path: editor-smoke/
          if-no-files-found: warn

      # A script module built by the editor, changed and built again while it runs: reloaded, the fields kept.
      - name: Script hot reload test
        run: Tests/hot_reload_test.sh

      # The three sample games exported by the editor, each tested the way a player gets it (Tests/export_test.sh:
      # --version, a timed run, a headless run with a screenshot, moved elsewhere) and only then packed as
      # <Name>-<version>-linux-x86_64.tar.gz + .sha256 (unpacked again and started): this commit's player builds.
      # A tar.gz keeps the launcher's and the player's executable bits, which an artefact's zip would drop.
      - name: Export test + player builds
        run: Tests/package_games.sh --out player-builds

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-test-${{ matrix.compiler.cc }}
          path: |
            player-builds/logs/
            player-builds/summary.md
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: player-builds-${{ matrix.compiler.cc }}
          path: |
            player-builds/*.tar.gz
            player-builds/*.sha256
            player-builds/packages.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Smoke test (headless render)
        run: |
          ZAMIN_MAX_FRAMES=60 ZAMIN_SCREENSHOT=platformer.png xvfb-run -a -s "-screen 0 1280x720x24" ./build/bin/ZaminPlayer Projects/Platformer2D
          ZAMIN_MAX_FRAMES=60 ZAMIN_SCREENSHOT=showcase.png xvfb-run -a -s "-screen 0 1280x720x24" ./build/bin/ZaminPlayer Projects/Showcase3D
          ZAMIN_MAX_FRAMES=60 ZAMIN_SCREENSHOT=editor.png xvfb-run -a -s "-screen 0 1600x900x24" ./build/bin/ZaminEditor Projects/Showcase3D

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.compiler.cc }}
          path: "*.png"

  # Sanitizers (Tests/sanitize.sh, cmake -DZAMIN_SANITIZE=..., a Debug build of its own): AddressSanitizer with
  # LeakSanitizer at exit - the unit tests, the three games and the editor headless, and the editor smoke test (every
  # window, menu, popup and inspector) - and UndefinedBehaviorSanitizer with Clang (every report in our code fatal).
  # Any report fails the job, even when the tests pass; third-party noise is listed in Tests/sanitizers/*.supp.
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            mode: address
            args: --smoke --editor-smoke
          - name: ubsan-clang
            mode: undefined
            args: --compiler clang
    steps:
      - uses: actions/checkout@v4

      # libclang-rt-18-dev: Clang's sanitizer runtimes (without it clang++ -fsanitize=undefined does not link).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb mesa-utils \
            libgl1-mesa-dri libglx-mesa0 libclang-rt-18-dev

      - name: Sanitizer (${{ matrix.name }})
        run: Tests/sanitize.sh ${{ matrix.mode }} ${{ matrix.args }} --log-dir sanitizer-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-${{ matrix.name }}
          path: sanitizer-logs/
          if-no-files-found: warn

  # clang-format (.clang-format: the code base's existing style) on the lines this push / pull request changed only;
  # advisory - a warning annotation per hunk and the diff on the run's page (some house conventions, such as several
  # short statements on one line, cannot be expressed in clang-format). The second step guards .clang-format itself:
  # the whole code base must stay within 3.5 % of it.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: clang-format (changed lines)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          Tests/format_check.sh --base "$BASE" --github

      - name: .clang-format against the code base
        run: Tests/format_check.sh --stats --max-percent 3.5

  # Code coverage (gcov): a coverage build of its own (cmake/Coverage.cmake: our targets only), the unit tests in it
  # and the report per module (Tests/coverage_report.py) - on the run's page and as an artefact (the HTML per file too).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols
          # gcovr (the HTML report per file) with pipx: the runner's Python is externally managed (PEP 668), a plain
          # pip install is refused there. Without gcovr Tests/coverage.sh still writes the Markdown / JSON report.
          pipx install gcovr || sudo apt-get install -y gcovr || echo "::warning::gcovr o'rnatilmadi: HTML hisobotsiz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH" # pipx's default bin folder (the runner's own is on PATH already)

      - name: Code coverage (gcov)
        run: Tests/coverage.sh --html --out coverage-report

      - name: Coverage summary
        if: always()
        run: cat coverage-report/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
